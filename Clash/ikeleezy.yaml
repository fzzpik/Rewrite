
# 锚点 - 节点订阅的参数 [每24小时更新一次订阅节点，每 6 秒一次健康检查]
NodeParam: &NodeParam {type: http, interval: 86400, health-check: {enable: true, url: 'http://www.gstatic.com/generate_204', interval: 6}}

# 锚点 - 节点订阅
proxy-providers: 
  机场名称1:
    url: '订阅链接'
    <<: *NodeParam
    path: './proxy_providers/机场名称1.yaml'
    override:
      additional-prefix: "[优] " # 为订阅节点添加机场名称前缀
  机场名称2:
    url: '订阅链接2'
    <<: *NodeParam
    path: './proxy_providers/机场名称2.yaml'
    override:
      additional-prefix: "[备] " # 为订阅节点添加机场名称前缀
    filter: '^(?=.*(2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3)).*$'

# mihomo 配置

port: 7890
socks-port: 7891
mixed-port: 7892
redir-port: 7893
tproxy-port: 7894

unified-delay: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

allow-lan: true
mode: rule
log-level: info
ipv6: true
udp: true

external-controller: 0.0.0.0:9090
# external-ui: ui
# external-ui-url: 'https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip'

geox-url:
  geoip: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geoip.dat'
  geosite: 'https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/geosite.dat'
  mmdb: 'https://geodata.kelee.one/Country-Masaiki.mmdb'
  asn: 'https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb'

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com

  skip-domain:
    - Mijia Cloud

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

# P2P下载端口
listeners:
- name: socks5-in-1
  type: socks
  port: 10808
  listen: 0.0.0.0
  udp: true
  users: []
  proxy: DIRECT

dns:
  enable: true
  prefer-h3: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "*"
    - +.lan
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query



# 锚点 - 节点筛选组
FilterHK: &FilterHK '(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美|0\.1|0\.01|0\.5|2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3)).)*$'
FilterTW: &FilterTW '(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美|0\.1|0\.01|0\.5|2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3)).)*$'
FilterJP: &FilterJP '(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美|0\.1|0\.01|0\.5|2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3)).)*$'
FilterSG: &FilterSG '(?=.*(新|狮|獅|SG|(?i)Singapore))^((?!(港|台|日|韩|美|0\.1|0\.01|0\.5|2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3)).)*$'
FilterUS: &FilterUS '(?=.*(美|US|(?i)States|American))^((?!(港|台|日|韩|新|0\.1|0\.01|0\.5|2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3)).)*$'
FilterSGDB: &FilterSGDB '(?=.*(新|狮|獅|SG|(?i)Singapore))(?=.*(0\.1|0\.5))^((?!(港|台|日|韩|美)).)*$'
FilterUSDB: &FilterUSDB '(?=.*(美|US|(?i)States|American))(?=.*(0\.1|0\.5))^((?!(港|台|日|韩|新)).)*$'
FilterUSGB: &FilterUSGB '(?=.*(美|US|(?i)States|American))(?=.*(2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3))^((?!(港|台|日|韩|新)).)*$'
FilterDB: &FilterDB '^.*0\.(001|01|1|5).*$'
FilterGB: &FilterGB '^(?=.*(2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3)).*$'
FilterAll: &FilterAll '^(?!.*(?:0\.1|0\.01|0\.5|2[×x]|2\.5[×x]|3[×x]|[×x]2|[×x]2\.5|[×x]3|客户端|重置|套餐)).*$'
FilterAlll: &FilterAlll '^(?!.*(?:0\.1|0\.01|0\.5|客户端|重置|套餐)).*$'
# 策略组参数锚点
# 锚点 - 时延优选参数 [每 6 秒一次惰性健康检查，容差 20ms，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
UrlTest: &UrlTest {type: url-test, interval: 6, tolerance: 20, lazy: true, url: 'http://www.gstatic.com/generate_204', disable-udp: false, timeout: 5000, max-failed-times: 3, hidden: true, include-all-providers: true}
# 锚点 - 故障转移参数 [每 6 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
FallBack: &FallBack {type: fallback, interval: 6, lazy: true, url: 'http://www.gstatic.com/generate_204', disable-udp: false, timeout: 5000, max-failed-times: 3, hidden: false, include-all-providers: true}
# 锚点 - 负载均衡参数 [每 6 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
LoadBalance: &LoadBalance {type: load-balance, interval: 6, lazy: true, url: 'http://www.gstatic.com/generate_204', disable-udp: false, strategy: consistent-hashing, timeout: 5000, max-failed-times: 3, hidden: true, include-all-providers: true}
# 锚点 - 规则参数 [每小时更新一次订阅规则，更新规则时使用直连策略]
RuleProviders: &RuleProviders {type: http, behavior: classical, interval: 3600, format: yaml, proxy: DIRECT}


# 策略组代理列表模板 - 预定义的代理节点优先级排序
SelectFina: &SelectFina  {type: select, proxies: [自动选择, 日本自动, 新国自动, 美国自动, 美国低倍, 新国低倍, 美国高倍, 全球手动, DIRECT]}
SelectAL: &SelectAL      {type: select, proxies: [自动选择, 兜底后备, 美国高倍, 日本自动, 新国自动, 美国自动, 全球手动]}
SelectDB: &SelectDB      {type: select, proxies: [ 美国低倍, 新国低倍, 兜底后备, 全球手动, DIRECT]}
# 策略组
proxy-groups: 
  
  
  - {name: 兜底后备, <<: *SelectFina, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png}
  - {name: 人工智能, <<: *SelectAL, icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/ChatGPT6.png}
  - {name: 国际媒体, <<: *SelectDB, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Streaming.png}
  - {name: 全球加速, <<: *SelectAL, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png}
  
  #- {name: 低倍手动, type: select, include-all: true, filter: *FilterDB, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/x0.1.png}
  #- {name: 高倍手动, type: select, include-all: true, filter: *FilterGB, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/x2.png}
  - {name: 全球手动, type: select, include-all: true, filter: *FilterAlll, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/China.png}


  - {name: 日本自动, <<: *UrlTest,     filter: *FilterJP, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png}
  - {name: 新国自动, <<: *UrlTest,     filter: *FilterSG, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png}
  - {name: 美国自动, <<: *UrlTest,     filter: *FilterUS, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png}
  - {name: 美国低倍, <<: *UrlTest,     filter: *FilterUSDB, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/x0.1.png}
  - {name: 新国低倍, <<: *UrlTest,     filter: *FilterSGDB, icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/x0.1.png}
  - {name: 美国高倍, <<: *UrlTest,     filter: *FilterUSGB, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/China.png}
  - {name: 自动选择, <<: *UrlTest,     filter: *FilterAll, icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png}

  
  
# 订阅规则
rule-providers:
  LAN:
    <<: *RuleProviders
    path: './rules/Lan.yaml'
    url: 'https://kelee.one/Tool/Clash/Rule/LAN_SPLITTER.yaml'

  Direct:
    <<: *RuleProviders
    path: './rules/Direct.yaml'
    url: 'https://kelee.one/Tool/Clash/Rule/Direct.yaml'

  Proxy:
    <<: *RuleProviders
    path: './rules/Proxy.yaml'
    url: 'https://kelee.one/Tool/Clash/Rule/Proxy.yaml'

  Emby:
    <<: *RuleProviders
    path: './rules/Emby.yaml'
    url: 'https://raw.githubusercontent.com/fzzpik/Rewrite/refs/heads/main/Rules/Clash/Emby.yaml'
    
  GlobalMedia:
    <<: *RuleProviders
    path: './rules/GlobalMedia.yaml'
    url: 'https://rule.kelee.one/Clash/GlobalMedia.yaml'

  Google:
    <<: *RuleProviders
    path: './rules/Google.yaml'
    url: 'https://rule.kelee.one/Clash/Google.yaml'
    
    
  Global:
    <<: *RuleProviders
    path: './rules/Global.yaml'
    url: 'https://rule.kelee.one/Clash/Global.yaml'
    
  AI:
    <<: *RuleProviders
    path: './rules/AI.yaml'
    url: 'https://kelee.one/Tool/Clash/Rule/AI.yaml'

  ESET_China:
    <<: *RuleProviders
    path: './rules/ESET_China.yaml'
    url: 'https://kelee.one/Tool/Clash/Rule/ESET_China.yaml'

# 规则指向
rules:
  - RULE-SET, LAN, DIRECT
  - RULE-SET, Direct, DIRECT
  #- RULE-SET, Proxy, 兜底后备
  - RULE-SET, Emby, 国际媒体
  - RULE-SET, GlobalMedia, 国际媒体
  - RULE-SET, AI, 人工智能
  - RULE-SET, Google, 人工智能
  - RULE-SET, Global, 全球加速
  - RULE-SET, ESET_China, DIRECT
  - GEOIP, CN, DIRECT
  - MATCH, 兜底后备
